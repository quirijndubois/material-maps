name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk material-maps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: material-maps-apk
          path: material-maps.apk

      # Every push to main also becomes a GitHub Release, so the APK can be
      # downloaded straight from a phone without signing in.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Material Maps build ${{ github.run_number }}
          files: material-maps.apk
          make_latest: true
