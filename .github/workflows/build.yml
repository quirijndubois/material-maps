name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in repository secrets, not in git. KEYSTORE_BASE64 is
      # the output of `base64 -w0 keystore/materialmaps.jks`.
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release*.apk material-maps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: material-maps-apk
          path: material-maps.apk

      # Every push to main also becomes a GitHub Release, so the APK can be
      # downloaded straight from a phone without signing in.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Material Maps build ${{ github.run_number }}
          files: material-maps.apk
          make_latest: true
